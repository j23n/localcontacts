name: LocalContacts
options:
  bundleIdPrefix: com.j23n.localcontacts
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"

targets:
  LocalContacts:
    type: application
    platform: iOS
    sources:
      - path: LocalContacts
        excludes:
          - Info.plist
          - LocalContacts.entitlements
    info:
      path: LocalContacts/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: LocalContacts
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSContactsUsageDescription: "LocalContacts syncs your vCard contacts to the system Contacts app so they appear in caller ID, QuickType, and the Apple Contacts app."
        # No cryptography of any kind — skips App Store Connect's
        # export compliance questionnaire.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: LocalContacts/LocalContacts.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.j23n.localcontacts.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_STRICT_CONCURRENCY: complete
    postBuildScripts:
      - name: Set Build Number from Git
        script: |
          BUILD=$(git -C "$SRCROOT" rev-list --count HEAD)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
    scheme:
      testTargets:
        - LocalContactsTests

  LocalContactsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LocalContactsTests
    dependencies:
      - target: LocalContacts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.j23n.localcontacts.app.tests
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
