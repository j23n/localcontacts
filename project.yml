name: LocalContacts
options:
  bundleIdPrefix: com.j23n.localcontacts
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"

targets:
  LocalContacts:
    type: application
    platform: iOS
    sources:
      - path: LocalContacts
        excludes:
          - Info.plist
          - LocalContacts.entitlements
    info:
      path: LocalContacts/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: LocalContacts
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSContactsUsageDescription: "LocalContacts syncs your vCard contacts to the system Contacts app so they appear in caller ID, QuickType, and the Apple Contacts app."
        # No cryptography of any kind — skips App Store Connect's
        # export compliance questionnaire.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: LocalContacts/LocalContacts.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.j23n.localcontacts.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_STRICT_CONCURRENCY: complete
    postBuildScripts:
      - name: Set Build Number from Git
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/.git/HEAD
        outputFiles:
          - $(DERIVED_FILE_DIR)/build-number.stamp
        script: |
          set -euo pipefail
          export PATH="/usr/bin:/bin:/usr/local/bin:/opt/homebrew/bin:$PATH"
          BUILD=$(/usr/bin/git -C "$SRCROOT" rev-list --count HEAD)
          if [ -z "$BUILD" ]; then
            echo "error: git rev-list --count HEAD returned empty" >&2
            exit 1
          fi
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST"
          mkdir -p "$DERIVED_FILE_DIR"
          echo "$BUILD" > "$DERIVED_FILE_DIR/build-number.stamp"
          echo "note: set CFBundleVersion=$BUILD in $PLIST"
    scheme:
      testTargets:
        - LocalContactsTests

  LocalContactsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LocalContactsTests
    dependencies:
      - target: LocalContacts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.j23n.localcontacts.app.tests
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
